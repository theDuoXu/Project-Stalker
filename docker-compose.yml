version: '3.8'

services:
  # --- SERVICIO 1: POSTGRESQL (PGVECTOR) ---
  postgres-db:
    image: pgvector/pgvector:pg15
    container_name: projectstalker-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectstalker_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dev-tools/docker-data:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intelligence_net

  # --- SERVICIO 2: NEO4J ---
  neo4j:
    image: neo4j
    container_name: stalker_intelligence
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/12345678secret
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=4G
    volumes:
      - ./notebooks/neo4j_data:/data
      - ./notebooks/neo4j_logs:/logs
      - ./notebooks/neo4j_import:/var/lib/neo4j/import
    restart: unless-stopped
    networks:
      - intelligence_net

  # --- SERVICIO 3: NEODASH ---
  neodash:
    image: neo4jlabs/neodash
    container_name: stalker_dashboard
    ports:
      - "5005:5005"
    restart: unless-stopped
    networks:
      - intelligence_net

  # --- SERVICIO 4: CASSANDRA ---
  cassandra:
    image: cassandra:4.1.10
    container_name: stalker_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=StalkerCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - JVM_OPTS=-Xms2G -Xmx2G
      - MALLOC_ARENA_MAX=2
    volumes:
      - ./notebooks/cassandra_data:/var/lib/cassandra
    ulimits:
      memlock: -1
      nproc: 32768
    restart: unless-stopped
    networks:
      - intelligence_net
    healthcheck:
      test: [ "CMD-SHELL", "[ $$(nodetool statusgossip) = running ]" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 6G

  # --- SERVICIO 5: PROMETHEUS ---
  prometheus:
    image: prom/prometheus
    container_name: stalker_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./notebooks/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
    networks:
      - intelligence_net

  # --- SERVICIO 6: GRAFANA ---
  grafana:
    image: grafana/grafana
    container_name: stalker_grafana
    user: "0"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./notebooks/grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - intelligence_net

# --- VOLÚMENES PERSISTENTES ---
volumes:
  postgres_data:

# --- RED COMPARTIDA ----
networks:
  intelligence_net:
    driver: bridge
